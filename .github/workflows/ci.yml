name: CI

on:
  push:
    branches: [main, de-pmc]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore linked-art-net.slnx

      - name: Build
        run: dotnet build linked-art-net.slnx --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test linked-art-net.slnx --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  # The Dockerfiles copy project folders by name, so a new project reference breaks the image build but not the
  # solution build. Building both images here (without pushing) catches that before a release tag does.
  images-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dates-service
            dockerfile: src/LinkedArtNet.Dates.Service/Dockerfile
          - name: examples-site
            dockerfile: src/LinkedArtNet.ExamplesSite/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ matrix.name }}:ci
