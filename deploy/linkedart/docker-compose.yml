# linkedart.net: the examples site and the dates service, behind the shared Caddy in deploy/edge.
# Images come from GHCR (built by .github/workflows/docker.yml on v* tags). Configuration and secrets come from .env
# (see .env.example). The trainer's data and the service's capture file live in ./data, which must be writable by the
# application user of the chiseled images (uid 1654): `sudo chown -R 1654:1654 data`.
#
#   docker compose pull && docker compose up -d
#   docker compose logs -f --tail=100
services:
  site:
    image: ghcr.io/tomcrane/linked-art-net/examples-site:${IMAGE_TAG:-latest}
    container_name: linkedart-site
    restart: unless-stopped
    environment:
      # behind Caddy: trust X-Forwarded-Proto so the trainer builds https:// callback URLs
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      TimeSpanService__BaseUrl: http://linkedart-dates:8080
      TimeSpanService__PublicUrl: https://dates.linkedart.net
      Trainer__DataDirectory: /data/trainer
      Trainer__CapturePath: /data/capture/unparsed.jsonl
      Trainer__Reviewers__0: ${TRAINER_REVIEWER}
      Trainer__GitHub__ClientId: ${GITHUB_CLIENT_ID}
      Trainer__GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET}
      Trainer__Submission__Repo: ${SUBMISSION_REPO:-tomcrane/linked-art-net}
      Trainer__Submission__Token: ${GITHUB_SUBMISSION_TOKEN}
      Trainer__Submission__BaseBranch: ${SUBMISSION_BASE_BRANCH:-de-pmc}
    volumes:
      - ./data/trainer:/data/trainer
      - ./data/capture:/data/capture:ro
    networks:
      - web
    depends_on:
      - dates

  dates:
    image: ghcr.io/tomcrane/linked-art-net/dates-service:${IMAGE_TAG:-latest}
    container_name: linkedart-dates
    restart: unless-stopped
    environment:
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Capture__Enabled: "true"
      Capture__Path: /data/capture/unparsed.jsonl
    volumes:
      - ./data/capture:/data/capture
    networks:
      - web

networks:
  web:
    external: true
