name: Container images

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: dates-service
            dockerfile: src/LinkedArtNet.Dates.Service/Dockerfile
          - name: examples-site
            dockerfile: src/LinkedArtNet.ExamplesSite/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest
